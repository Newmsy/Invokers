name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # A data export that changes the game version must bring that update's change notes (see scripts/update-notes.ts).
      - name: Check update notes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          node scripts/check-update-notes.ts FETCH_HEAD
      # Unit tests (box file decoder).
      - run: npm test
      # Type-checks the site, then builds it into site/dist.
      - run: npm run build
        env:
          # Public Supabase settings (repo Actions variables). Unset means a browser-only build.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_AUTH_PROVIDERS: ${{ vars.PUBLIC_AUTH_PROVIDERS }}
      # Every link between pages (and to an #anchor) must lead somewhere.
      - run: node scripts/check-links.ts
      # Nothing downstream needs this copy of the build, so a full artifact quota mustn't fail CI.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: site
          path: site/dist
          retention-days: 3
